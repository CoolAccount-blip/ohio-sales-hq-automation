name: Discover Ohio Businesses

on:
  workflow_dispatch:
  schedule:
    # Monday 12:17 UTC. GitHub may delay scheduled workflows during busy periods.
    - cron: '17 12 * * 1'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out automation code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download latest Ohio OpenStreetMap extract
        run: |
          curl --fail --location --retry 3 --retry-delay 5 \
            https://download.geofabrik.de/north-america/us/ohio/ohio-latest.osm.pbf \
            --output ohio-latest.osm.pbf

      - name: Discover target businesses and de-duplicate in Sheets
        env:
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          SHEETS_WEBHOOK_SECRET: ${{ secrets.SHEETS_WEBHOOK_SECRET }}
        run: |
          python discover_osm.py --input ohio-latest.osm.pbf --output discoveries.jsonl
