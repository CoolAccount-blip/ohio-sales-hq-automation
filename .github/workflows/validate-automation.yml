name: Validate Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Test public email extraction and chain filter
        run: python tests_test_email_enricher.py

      - name: Test discovery chain filter
        run: python tests_test_discovery_chains.py

      - name: Test deduplication keys and chain filter
        run: node tests_test_dedupe_logic.js

      - name: Test Apps Script receiver and email queue
        run: node tests_test_apps_script.js
