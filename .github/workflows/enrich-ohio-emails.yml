name: Find Public Business Emails

on:
  workflow_dispatch:
  schedule:
    # Twice daily at 01:30 and 13:30 UTC; up to 40 queued websites per run.
    - cron: '30 1,13 * * *'

permissions:
  contents: read

concurrency:
  group: ohio-email-research-queue
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out automation code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Research official websites for published contact emails
        env:
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          SHEETS_WEBHOOK_SECRET: ${{ secrets.SHEETS_WEBHOOK_SECRET }}
        run: |
          python email_enricher.py --webhook-url "$SHEETS_WEBHOOK_URL" --webhook-secret "$SHEETS_WEBHOOK_SECRET" --max-records 40
